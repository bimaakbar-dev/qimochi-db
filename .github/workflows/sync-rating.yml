name: Sync Ratings

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Sync ratings from Worker
        run: node scripts/sync-ratings.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/api/v1/ratings.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync ratings [skip ci]"
            git push
          fi