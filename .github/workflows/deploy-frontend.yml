name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout yukionime
        uses: actions/checkout@v7

      - name: Checkout yukio-data
        uses: actions/checkout@v7
        with:
          repository: bimaakbar-dev/yukio-data
          path: _data

      - name: Inject data
        run: |
          mkdir -p src/data
          mkdir -p src/content/anime
          cp -r _data/data/* src/data/
          cp -rn _data/src/content/anime/* src/content/anime/ 2>/dev/null || true
          echo "=== src/data ==="
          ls -la src/data/
          echo "=== src/content/anime (count) ==="
          ls -1 src/content/anime/ | wc -l
          echo "=== New markdown files ==="
          ls -1 src/content/anime/ | head -20

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=yukionime --branch=main