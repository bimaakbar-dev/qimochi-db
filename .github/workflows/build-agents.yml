name: Build AGENTS.md

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/agents-src/**'
      - '.github/workflows/build-agents.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Concat source files
        run: |
          set -e
          mkdir -p docs/agents-src
          cat docs/agents-src/01.md \
              docs/agents-src/02.md \
              docs/agents-src/03.md \
              > AGENTS.md
          echo "== Ukuran AGENTS.md =="
          wc -l AGENTS.md

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          if git diff --staged --quiet; then
            echo "AGENTS.md tidak berubah."
          else
            git commit -m "docs: regenerate AGENTS.md [skip ci]"
            git push
          fi