name: Dump isi repo

# Jalankan manual: tab Actions, pilih "Dump isi repo", klik Run workflow.
# Hasilnya file repo-dump.txt di branch "repo-dump" pada repo ini.

on:
  workflow_dispatch:
    inputs:
      max_kb:
        description: Batas ukuran per file (KB)
        default: '200'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gabungkan isi repo
        env:
          MAX_KB: ${{ inputs.max_kb }}
        run: |
          OUT=repo-dump.txt
          MAX=$(( ${MAX_KB:-200} * 1024 ))
          SKIP='(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?)$'

          {
            echo "# Repo: $GITHUB_REPOSITORY"
            echo "# Commit: $GITHUB_SHA"
            echo
            echo "## Struktur file"
            git ls-files | grep -Ev "$SKIP"
            echo
            echo "## Isi file"
          } > "$OUT"

          : > skipped.txt

          # git ls-files hanya memuat file yang di-track, jadi .env, node_modules,
          # dist, dan file di .gitignore otomatis tidak ikut.
          git ls-files -z | while IFS= read -r -d '' f; do
            if echo "$f" | grep -Eq "$SKIP"; then continue; fi
            [ -f "$f" ] || continue

            if ! grep -Iq . "$f"; then
              echo "biner atau kosong: $f" >> skipped.txt
              continue
            fi

            size=$(wc -c < "$f")
            if [ "$size" -gt "$MAX" ]; then
              echo "terlalu besar ($size byte): $f" >> skipped.txt
              continue
            fi

            {
              echo
              echo "===== FILE: $f ====="
              cat "$f"
            } >> "$OUT"
          done

          {
            echo
            echo "## File yang dilewati"
            cat skipped.txt
          } >> "$OUT"

          {
            echo "### Dump selesai"
            echo "Ukuran: $(wc -c < "$OUT") byte"
            echo "Dilewati: $(wc -l < skipped.txt) file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan hasil ke branch repo-dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branch yatim piatu: hanya berisi repo-dump.txt, branch utama tidak tersentuh
          # dan workflow deploy tidak ikut terpicu.
          git checkout --orphan repo-dump
          git rm -rf --quiet .
          git add repo-dump.txt
          git commit -m "Dump isi repo @ ${GITHUB_SHA::7}"
          git push --force origin repo-dump

          echo "File: https://github.com/$GITHUB_REPOSITORY/blob/repo-dump/repo-dump.txt" >> "$GITHUB_STEP_SUMMARY"
