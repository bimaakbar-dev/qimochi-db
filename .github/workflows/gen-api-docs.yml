name: Generate API Docs

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/pages/api/v1/**'
      - 'scripts/gen-api-docs.mjs'
      - '.github/workflows/gen-api-docs.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate README section
        run: node scripts/gen-api-docs.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "docs: auto-generate API section [skip ci]"
            git push
          fi